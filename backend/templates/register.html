{% extends "base.html" %}


{% block title %}
Sign Up | FixMyCity
{% endblock %}


{% block body_class %}
auth-page
{% endblock %}


{% block content %}


<header class="auth-navbar">

    <a href="{% url 'home' %}" class="auth-logo">
        FixMyCity
    </a>

    <a href="{% url 'login' %}" class="back-home">
        ← Back to Login
    </a>

</header>



<main class="auth-container">

    <div class="login-card">

        <div class="auth-heading">

            <div class="auth-icon">
                +
            </div>

            <h1>
                Create Account
            </h1>

            <p>
                Join FixMyCity and help improve your city
            </p>

        </div>



        <!-- =====================================================
             CITIZEN REGISTRATION FORM
        ===================================================== -->

        <form
            class="login-form"
            id="registerForm"
            method="POST"
            action="{% url 'register_citizen' %}"
        >

            {% csrf_token %}


            <!-- FULL NAME -->

            <div class="form-group">

                <label for="full_name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="full_name"
                    name="full_name"
                    placeholder="Enter your full name"
                    required
                >

            </div>



            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>



            <!-- PHONE -->

            <div class="form-group">

                <label for="phone">
                    Phone Number
                </label>

                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Enter your phone number"
                    required
                >

            </div>



            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    required
                >

            </div>



            <!-- CONFIRM PASSWORD -->

            <div class="form-group">

                <label for="confirm_password">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Confirm your password"
                    required
                >

            </div>



            <!-- REGISTRATION MESSAGE -->

            <div
                id="registerMessage"
                style="display: none;"
            ></div>



            <!-- REGISTER BUTTON -->

            <button
                type="submit"
                class="login-submit"
            >
                Create Account
                <span>→</span>
            </button>

        </form>



        <!-- LOGIN LINK -->

        <div class="signup-text">

            <span>
                Already have an account?
            </span>

            <a href="{% url 'login' %}">
                Sign In
            </a>

        </div>


    </div>

</main>


{% endblock %}
