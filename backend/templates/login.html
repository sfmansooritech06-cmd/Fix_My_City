{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | FixMyCity</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">

</head>


<body class="auth-page">


<!-- =====================================================
     AUTH NAVBAR 
===================================================== -->

<header class="auth-navbar">

    <a href="{% url 'home' %}" class="auth-logo">
        FixMyCity
    </a>

    <a href="{% url 'home' %}" class="back-home">
        ← Back to Home
    </a>

</header>



<!-- =====================================================
     LOGIN
===================================================== -->

<main class="auth-container">

    <div class="login-card">


        <!-- LOGO / HEADING -->

        <div class="auth-heading">

            <div class="auth-icon">
                ◉
            </div>

            <h1>
                Welcome back
            </h1>

            <p>
                Sign in to continue to FixMyCity
            </p>

        </div>



        <!-- =================================================
             WHO ARE YOU
        ================================================= -->

        <div class="role-selection">

            <label>
                Who are you?
            </label>


            <div class="role-options">


                <!-- CITIZEN -->

                <button
                    type="button"
                    class="role-option active"
                >

                    <span class="role-option-icon">
                        👤
                    </span>

                    <span>
                        Citizen
                    </span>

                </button>



                <!-- OFFICER -->

                <a
                    href="/officer/login/"
                    class="role-option"
                >

                    <span class="role-option-icon">
                        ◈
                    </span>

                    <span>
                        Officer
                    </span>

                </a>



                <!-- ADMIN -->

                <a
                    href="/admin/login/"
                    class="role-option"
                >

                    <span class="role-option-icon">
                        ⚙
                    </span>

                    <span>
                        Admin
                    </span>

                </a>


            </div>

        </div>



        <!-- =================================================
             LOGIN FORM
        ================================================= -->

        <form
            class="login-form"
            id="loginForm"
            method="POST"
            action="{% url 'citizen_login' %}"
        >

            {% csrf_token %}


            <div class="form-group">

                <label for="login_value">
                    Email Address or Citizen ID
                </label>

                <input
                    type="text"
                    id="login_value"
                    name="login_value"
                    placeholder="Enter email or citizen ID"
                    required
                >

            </div>



            <div class="form-group">

                <div class="password-label">

                    <label for="password">
                        Password
                    </label>

                    <a href="#">
                        Forgot password?
                    </a>

                </div>


                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>



            <!-- ERROR / SUCCESS MESSAGE -->

            <div
                id="loginMessage"
                style="display: none;"
            ></div>



            <button
                type="submit"
                class="login-submit"
            >
                Sign In
                <span>→</span>
            </button>


        </form>



        <!-- =================================================
             REGISTER
        ================================================= -->

        <div class="signup-text">

            <span>
                Don't have an account?
            </span>

            <a href="{% url 'register' %}">
                Sign Up
            </a>

        </div>


    </div>

</main>



<!-- =====================================================
     LOGIN JAVASCRIPT
===================================================== -->

<script>

const loginForm = document.getElementById("loginForm");
const loginMessage = document.getElementById("loginMessage");


loginForm.addEventListener("submit", async function(event) {

    event.preventDefault();

    const formData = new FormData(loginForm);

    try {

        const response = await fetch(
            loginForm.action,
            {
                method: "POST",
                body: formData,
                headers: {
                    "X-Requested-With": "XMLHttpRequest"
                }
            }
        );

        const data = await response.json();


        loginMessage.style.display = "block";
        loginMessage.textContent = data.message;


        if (data.success) {

            loginMessage.style.color = "#22c55e";

            window.location.href = data.redirect;

        } else {

            loginMessage.style.color = "#ef4444";

        }

    } catch (error) {

        loginMessage.style.display = "block";
        loginMessage.style.color = "#ef4444";
        loginMessage.textContent =
            "Something went wrong. Please try again.";

        console.error(error);

    }

});

</script>


</body>

</html>
