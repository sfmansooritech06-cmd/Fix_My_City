<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Sign Up | FixMyCity</title>

    <link rel="stylesheet" href="./css/style.css">

</head>


<body class="auth-page">


<header class="auth-navbar">

    <a href="index.html" class="auth-logo">
        FixMyCity
    </a>

    <a href="login.html" class="back-home">
        ← Back to Login
    </a>

</header>



<main class="auth-container">

    <div class="login-card">

        <div class="auth-heading">

            <div class="auth-icon">
                +
            </div>

            <h1>
                Create Account
            </h1>

            <p>
                Join FixMyCity and help improve your city
            </p>

        </div>



        <!-- Citizen Registration Form -->

        <form
            class="login-form"
            method="POST"
            action="/api/register/"
        >

            <!-- Django CSRF -->
            <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">


            <div class="form-group">

                <label for="full_name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="full_name"
                    name="full_name"
                    placeholder="Enter your full name"
                    required
                >

            </div>



            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>



            <div class="form-group">

                <label for="phone">
                    Phone Number
                </label>

                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Enter your phone number"
                    required
                >

            </div>



            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    required
                >

            </div>



            <div class="form-group">

                <label for="confirm_password">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Confirm your password"
                    required
                >

            </div>



            <button
                type="submit"
                class="login-submit"
            >
                Create Account
                <span>→</span>
            </button>

        </form>



        <div class="signup-text">

            <span>
                Already have an account?
            </span>

            <a href="login.html">
                Sign In
            </a>

        </div>

    </div>

</main>


</body>

</html>
